    .moon {
      position: absolute;
      top: 9%;
      right: 11%;
      width: clamp(72px, 12vw, 130px);
      height: clamp(72px, 12vw, 130px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffef2 0%, #fde68a 58%, #f59e0b 100%);

      pointer-events: none;
    }
    .moon-reflect {
      position: absolute;
      top: 63%;
      right: 11%;
      width: clamp(80px, 14vw, 150px);
      height: 30%;
      background: linear-gradient(180deg, rgba(253, 224, 71, 0.25) 0%, rgba(253, 224, 71, 0.05) 60%, transparent 100%);
      filter: blur(12px);
      z-index: 2;
      pointer-events: none;

    @keyframes shimmer {
      0%, 100% { transform: scaleX(1); opacity: 0.7; }
      50% { transform: scaleX(1.22); opacity: 1; }

    .star {

      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--dur) ease-in-out infinite;

    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.25); }
    }
    .lantern {
      position: absolute;
      width: 18px;
      height: 24px;
      background: radial-gradient(circle at 50% 65%, #fef08a, #f97316 70%, #9a3412);
      border-radius: 45% 45% 25% 25%;
      box-shadow: 0 0 12px rgba(251, 146, 60, 0.75);
      pointer-events: none;
      opacity: 0;
      animation: riseLantern var(--dur) linear infinite;
    }
    @keyframes riseLantern {
      0% { transform: translateY(0) translateX(0) scale(0.7); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.7; }
      100% { transform: translateY(-55vh) translateX(var(--drift)) scale(0.35); opacity: 0; }
    }
    .river-area {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 39%;
      z-index: 10;
      overflow: hidden;
    }
    .wave-line {
      position: absolute;
      left: -10%;
      width: 120%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(147, 197, 253, 0.18), transparent);
      animation: waveMove 7s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes waveMove {
      0%, 100% { transform: translateX(-3%); }
      50% { transform: translateX(3%); }
    }
    .krathong-node {
      position: absolute;
      cursor: pointer;
      will-change: transform;
      transition: filter 0.2s ease;
    }
    .krathong-node:hover {
      filter: drop-shadow(0 0 12px rgba(253, 224, 71, 0.85));
      z-index: 90 !important;
    }
    .krathong-bob {
      animation: bobbing 3.2s ease-in-out infinite;
    }
    @keyframes bobbing {
      0%, 100% { transform: translateY(0px) rotate(-1.5deg); }
      50% { transform: translateY(-5px) rotate(1.5deg); }
    }
    .candle-flame {
      transform-origin: center bottom;
      animation: flicker 0.9s ease-in-out infinite alternate;
    }
    @keyframes flicker {
      0% { transform: scale(0.92) rotate(-2deg); opacity: 0.88; }
      100% { transform: scale(1.08) rotate(2deg); opacity: 1; }
    }
    .krathong-tooltip {
      opacity: 0;
      transform: translate(-50%, 6px);
      transition: all 0.2s ease;
      pointer-events: none;
    }
    @media (hover: hover) {
      .krathong-node:hover .krathong-tooltip {

        transform: translate(-50%, 0);
      }
    }
    .modal-backdrop {

      inset: 0;
      background: rgba(3, 7, 18, 0.72);

    function initEnvironment() {

      }

      const lanternCount = isMobile ? 5 : 10;
      for (let i = 0; i < lanternCount; i++) {
        const l = document.createElement("div");
        l.className = "lantern";

        l.style.bottom = "0%";

        l.style.setProperty("--drift", ((Math.random() - 0.5) * 90) + "px");

    const fxCanvas = $("fxCanvas");
    const fxCtx = fxCanvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      fxCanvas.width = window.innerWidth;
      fxCanvas.height = window.innerHeight;
    }

    function spawnFirework(x, y) {
      const colors = ["#fde047", "#f472b6", "#38bdf8", "#4ade80", "#fb923c", "#c084fc"];
      const color = colors[Math.floor(Math.random() * colors.length)];
      const count = window.innerWidth < 768 ? 24 : 42;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count;
        const speed = 1.5 + Math.random() * 3.6;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          color,
          size: 1.8 + Math.random() * 2
        });
      }
    }

    function celebrateFireworks() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      spawnFirework(w * 0.25, h * 0.22);
      setTimeout(() => spawnFirework(w * 0.5, h * 0.16), 240);
      setTimeout(() => spawnFirework(w * 0.75, h * 0.24), 480);
    }

    function animateLoop() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.alpha -= 0.016;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        fxCtx.globalAlpha = p.alpha;
        fxCtx.fillStyle = p.color;
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        fxCtx.fill();
      }
      fxCtx.globalAlpha = 1;

      const riverW = window.innerWidth;
      for (let i = 0; i < state.floatingNodes.length; i++) {
        const f = state.floatingNodes[i];
        f.x -= f.speed;
        if (f.x < -140) {
          f.x = riverW + 40 + Math.random() * 120;
        }
        f.el.style.transform = `translate3d(${f.x}px, 0, 0)`;
      }
      requestAnimationFrame(animateLoop);
    }

    function addFloatingKrathong(item, startFromRight = false) {
      const river = $("riverLayer");
      const lane = Math.random();
      const topPct = 6 + lane * 66;
      const isMobile = window.innerWidth < 768;
      const baseSize = isMobile ? 64 : 84;
      const size = Math.round(baseSize + lane * (isMobile ? 28 : 42));
      const speed = 0.28 + lane * 0.48;
      const x = startFromRight ? (window.innerWidth - size - 20) : (Math.random() * (window.innerWidth + 100));

      const wrap = document.createElement("div");
      wrap.className = "krathong-node";
      wrap.style.top = topPct + "%";
      wrap.style.zIndex = Math.round(10 + lane * 60);
      wrap.style.transform = `translate3d(${x}px, 0, 0)`;
      wrap.dataset.id = item.id;

      wrap.innerHTML = `
        <div class="krathong-tooltip absolute -top-9 left-1/2 whitespace-nowrap bg-slate-950/85 border border-amber-300/30 text-amber-100 text-xs px-2.5 py-1 rounded-full shadow-lg">
          ${escapeHtml(item.name)}
        </div>
        <div class="krathong-bob">${buildKrathongSVG(item.krathongId, size)}</div>
      `;

      wrap.addEventListener("click", () => openWishDetail(item));
      river.appendChild(wrap);
      state.floatingNodes.push({ id: item.id, el: wrap, x, speed });
    }

    function renderRiverKrathongs() {
      state.floatingNodes.forEach(f => f.el.remove());
      state.floatingNodes = [];
      const maxShow = window.innerWidth < 768 ? 14 : 24;
      state.krathongs.slice(0, maxShow).forEach(item => addFloatingKrathong(item, false));
    }

    function openWishDetail(item) {
      $("wishModalSvg").innerHTML = buildKrathongSVG(item.krathongId, 140);
      $("wishModalCat").textContent = item.category;
      $("wishModalName").textContent = item.name;
      $("wishModalKName").textContent = "แบบกระทง: " + item.krathongName;
      $("wishModalText").textContent = `"${item.wish}"`;
      $("wishModalTime").textContent = "ลอยเมื่อ " + item.timestamp;
      openModal("modalWish");
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    function renderCategoryTabs() {
      const box = $("catTabs");
      box.innerHTML = "";
      CATEGORIES.forEach(cat => {
        const btn = document.createElement("button");
        const active = state.selectedCategory === cat;
        btn.className = `touch-btn shrink-0 px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition ${active ? "bg-amber-400 text-slate-950" : "bg-white/10 text-slate-200 hover:bg-white/20"}`;
        btn.textContent = cat;
        btn.addEventListener("click", () => {
          state.selectedCategory = cat;
          renderCategoryTabs();
          renderKrathongGrid();
        });
        box.appendChild(btn);
      });
    }

    function updatePreview() {
      const k = KRATHONGS.find(x => x.id === state.selectedKrathongId) || KRATHONGS[0];
      $("previewBox").innerHTML = buildKrathongSVG(k.id, 112);
      $("previewCat").textContent = k.category;
      $("previewName").textContent = k.name;
    }

    function renderKrathongGrid() {
      const grid = $("krathongGrid");
      grid.innerHTML = "";
      const list = state.selectedCategory === "ทั้งหมด"
        ? KRATHONGS
        : KRATHONGS.filter(k => k.category === state.selectedCategory);

      list.forEach(k => {
        const selected = k.id === state.selectedKrathongId;
        const card = document.createElement("button");
        card.type = "button";
        card.className = `p-2 rounded-2xl border flex flex-col items-center gap-1 transition text-center ${selected ? "bg-amber-400/20 border-amber-400 shadow-lg shadow-amber-500/20" : "bg-slate-950/40 border-white/10 hover:bg-white/10"}`;
        card.innerHTML = `
          <div class="w-16 h-16 flex items-center justify-center">${buildKrathongSVG(k.id, 62)}</div>
          <span class="text-[11px] leading-tight line-clamp-2 text-slate-100">${k.name}</span>
        `;
        card.addEventListener("click", () => {
          state.selectedKrathongId = k.id;
          updatePreview();
          renderKrathongGrid();
        });
        grid.appendChild(card);
      });
    }

    function renderWishBoard(keyword = "") {
      const box = $("boardList");
      const q = keyword.trim().toLowerCase();
      const filtered = state.krathongs.filter(k =>
        k.name.toLowerCase().includes(q) ||
        k.wish.toLowerCase().includes(q) ||
        k.krathongName.toLowerCase().includes(q)
      );

      if (!filtered.length) {
        box.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400 text-sm">ไม่พบคำอธิษฐานที่ค้นหา</div>`;
        return;
      }

      box.innerHTML = "";
      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "bg-slate-950/50 border border-white/10 rounded-2xl p-3.5 flex gap-3 items-start hover:border-amber-400/40 transition cursor-pointer";
        card.innerHTML = `
          <div class="w-14 h-14 shrink-0 flex items-center justify-center bg-slate-900/80 rounded-xl">${buildKrathongSVG(item.krathongId, 52)}</div>
          <div class="min-w-0 flex-1 space-y-1">
            <div class="flex items-center justify-between gap-2">
              <h4 class="font-semibold text-sm text-amber-200 truncate">${escapeHtml(item.name)}</h4>
              <span class="text-[10px] text-slate-400 shrink-0">${escapeHtml(item.timestamp.split(" ")[1] || "")}</span>
            </div>
            <p class="text-xs text-slate-200 line-clamp-2">${escapeHtml(item.wish)}</p>
            <p class="text-[10px] text-slate-400">${escapeHtml(item.krathongName)}</p>
          </div>
        `;
        card.addEventListener("click", () => {
          closeModal("modalBoard");
          openWishDetail(item);
        });
        box.appendChild(card);
      });
    }

    function renderAdminDashboard(keyword = "") {
      $("admVisitors").textContent = state.visitors.toLocaleString();
      $("admKrathongs").textContent = state.krathongs.length.toLocaleString();

      const counts = {};
      state.krathongs.forEach(k => { counts[k.krathongName] = (counts[k.krathongName] || 0) + 1; });
      const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
      $("admPopular").textContent = top ? `${top[0]} (${top[1]})` : "-";

      const q = keyword.trim().toLowerCase();
      const filtered = state.krathongs.filter(k =>
        k.name.toLowerCase().includes(q) ||
        k.wish.toLowerCase().includes(q) ||
        k.krathongName.toLowerCase().includes(q)
      );

      const list = $("adminList");
      if (!filtered.length) {
        list.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">ไม่มีรายการข้อมูล</div>`;
        return;
      }

      list.innerHTML = "";
      filtered.forEach(item => {
        const row = document.createElement("div");
        row.className = "bg-slate-950/55 border border-white/10 rounded-2xl p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3";
        row.innerHTML = `
          <div class="flex items-start gap-3 min-w-0">
            <div class="w-12 h-12 shrink-0 flex items-center justify-center bg-slate-900 rounded-xl">${buildKrathongSVG(item.krathongId, 46)}</div>
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-2">
                <span class="font-semibold text-sm text-amber-200">${escapeHtml(item.name)}</span>
                <span class="text-[11px] px-2 py-0.5 rounded-full bg-white/10 text-slate-300">${escapeHtml(item.krathongName)}</span>
                <span class="text-[11px] text-slate-400">${escapeHtml(item.timestamp)}</span>
              </div>
              <p class="text-xs sm:text-sm text-slate-200 mt-1 break-words">${escapeHtml(item.wish)}</p>
            </div>
          </div>
          <button class="btn-del touch-btn shrink-0 px-3.5 py-2 rounded-xl bg-rose-500/20 hover:bg-rose-500/35 text-rose-200 text-xs font-medium transition">🗑️ ลบ</button>
        `;
        row.querySelector(".btn-del").addEventListener("click", () => handleDeleteKrathong(item.id));
        list.appendChild(row);
      });
    }

    async function fetchInitialData(action = "init") {
      if (!state.isLive) {
        const saved = localStorage.getItem("mock_krathongs_v1");
        state.krathongs = saved ? JSON.parse(saved) : [...MOCK_INITIAL];
        const v = Number(localStorage.getItem("mock_visitors_v1") || 127) + (action === "init" ? 1 : 0);
        state.visitors = v;
        localStorage.setItem("mock_visitors_v1", String(v));
        updateStatsUI();
        renderRiverKrathongs();
        return;
      }

      try {
        const res = await fetch(`${SCRIPT_URL}?action=${action}`);
        const data = await res.json();
        if (data.status === "success") {
          state.visitors = data.visitors;
          state.krathongs = data.krathongs || [];
          updateStatsUI();
          renderRiverKrathongs();
        }
      } catch (err) {
        showToast("เชื่อมต่อ Google Sheets ไม่สำเร็จ กำลังใช้ข้อมูลจำลอง");
        state.isLive = false;
        state.krathongs = [...MOCK_INITIAL];
        updateStatsUI();
        renderRiverKrathongs();
      }
    }

    async function handleLaunchKrathong() {
      const name = $("inputName").value.trim();
      const wish = $("inputWish").value.trim();
      if (!name) return showToast("กรุณากรอกชื่อผู้ลอย");
      if (!wish) return showToast("กรุณากรอกคำอธิษฐาน");

      const k = KRATHONGS.find(x => x.id === state.selectedKrathongId) || KRATHONGS[0];
      const btn = $("btnLaunch");
      btn.disabled = true;
      btn.textContent = "กำลังปล่อยกระทง...";

      const nowStr = new Date().toLocaleString("th-TH");
      let newItem = {
        id: "L" + Date.now(),
        timestamp: nowStr,
        name,
        wish,
        krathongId: k.id,
        krathongName: k.name,
        category: k.category
      };

      if (state.isLive) {
        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              action: "add",
              name,
              wish,
              krathongId: k.id,
              krathongName: k.name,
              category: k.category
            })
          });
          const data = await res.json();
          if (data.status === "success" && data.item) {
            newItem = data.item;
          }
        } catch (err) {
          showToast("บันทึกไม่สำเร็จ กรุณาลองใหม่");
          btn.disabled = false;
          btn.textContent = "อธิษฐานและปล่อยกระทง ✨";
          return;
        }
      } else {
        const updated = [newItem, ...state.krathongs];
        localStorage.setItem("mock_krathongs_v1", JSON.stringify(updated));
      }

      state.krathongs.unshift(newItem);
      updateStatsUI();
      addFloatingKrathong(newItem, true);
      closeModal("modalCreate");
      celebrateFireworks();
      showToast("ปล่อยกระทงและบันทึกคำอธิษฐานเรียบร้อยแล้ว 🪷");

      $("inputName").value = "";
      $("inputWish").value = "";
      btn.disabled = false;
      btn.textContent = "อธิษฐานและปล่อยกระทง ✨";
    }

    async function handleAdminLogin() {
      const pass = $("adminPassInput").value.trim();
      const errEl = $("adminLoginErr");
      errEl.classList.add("hidden");
      if (!pass) return;

      if (state.isLive) {
        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "verify", password: pass })
          });
          const data = await res.json();
          if (data.status !== "success") {
            errEl.textContent = data.message || "รหัสผ่านไม่ถูกต้อง";
            errEl.classList.remove("hidden");
            return;
          }
        } catch (e) {
          errEl.textContent = "ไม่สามารถตรวจสอบรหัสผ่านได้";
          errEl.classList.remove("hidden");
          return;
        }
      } else if (pass !== "1234") {
        errEl.textContent = "รหัสผ่านไม่ถูกต้อง (โหมดพรีวิวใช้ 1234)";
        errEl.classList.remove("hidden");
        return;
      }

      state.adminPassword = pass;
      $("adminPassInput").value = "";
      closeModal("modalAdminLogin");
      renderAdminDashboard();
      openModal("modalAdminDash");
    }

    async function handleDeleteKrathong(id) {
      if (!confirm("ต้องการลบคำอธิษฐานนี้ใช่หรือไม่?")) return;

      if (state.isLive) {
        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "delete", id, password: state.adminPassword })
          });
          const data = await res.json();
          if (data.status !== "success") {
            return showToast(data.message || "ลบไม่สำเร็จ");
          }
        } catch (e) {
          return showToast("เกิดข้อผิดพลาดในการเชื่อมต่อ");
        }
      }

      state.krathongs = state.krathongs.filter(k => k.id !== id);
      if (!state.isLive) {
        localStorage.setItem("mock_krathongs_v1", JSON.stringify(state.krathongs));
      }
      const nodeIdx = state.floatingNodes.findIndex(f => f.id === id);
      if (nodeIdx !== -1) {
        state.floatingNodes[nodeIdx].el.remove();
        state.floatingNodes.splice(nodeIdx, 1);
      }
      updateStatsUI();
      renderAdminDashboard($("adminSearch").value);
      showToast("ลบข้อมูลเรียบร้อยแล้ว");
    }

    document.querySelectorAll("[data-close]").forEach(btn => {
      btn.addEventListener("click", () => closeModal(btn.dataset.close));
    });

    document.querySelectorAll(".modal-backdrop").forEach(modal => {
      modal.addEventListener("click", e => {
        if (e.target === modal) modal.classList.remove("active");
      });
    });

    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeAllModals();
    });

    $("skyLayer").addEventListener("click", e => {
      spawnFirework(e.clientX, e.clientY);
    });

    $("btnOpenCreate").addEventListener("click", () => {
      updatePreview();
      openModal("modalCreate");
    });

    $("btnRandom").addEventListener("click", () => {
      const pick = KRATHONGS[Math.floor(Math.random() * KRATHONGS.length)];
      state.selectedKrathongId = pick.id;
      state.selectedCategory = "ทั้งหมด";
      renderCategoryTabs();
      renderKrathongGrid();
      updatePreview();
    });

    $("btnLaunch").addEventListener("click", handleLaunchKrathong);

    $("btnOpenBoard").addEventListener("click", () => {
      $("boardSearch").value = "";
      renderWishBoard();
      openModal("modalBoard");
    });

    $("boardSearch").addEventListener("input", e => renderWishBoard(e.target.value));

    $("btnAdmin").addEventListener("click", () => {
      if (state.adminPassword) {
        renderAdminDashboard();
        openModal("modalAdminDash");
      } else {
        $("adminLoginErr").classList.add("hidden");
        openModal("modalAdminLogin");
        setTimeout(() => $("adminPassInput").focus(), 100);
      }
    });

    $("btnAdminSubmit").addEventListener("click", handleAdminLogin);
    $("adminPassInput").addEventListener("keydown", e => {
      if (e.key === "Enter") handleAdminLogin();
    });

    $("adminSearch").addEventListener("input", e => renderAdminDashboard(e.target.value));

    $("btnAdminRefresh").addEventListener("click", async () => {
      await fetchInitialData("list");
      renderAdminDashboard($("adminSearch").value);
      showToast("อัปเดตข้อมูลล่าสุดแล้ว");
    });

    $("btnAdminLogout").addEventListener("click", () => {
      state.adminPassword = "";
      closeModal("modalAdminDash");
      showToast("ออกจากระบบหลังบ้านแล้ว");
    });

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
    initEnvironment();
    renderCategoryTabs();
    renderKrathongGrid();
    updatePreview();
    fetchInitialData("init");
    animateLoop();
  </script>
</body>
</html>
